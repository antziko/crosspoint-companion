[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.4.1

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

; --- TLS heap prototype (fix/tls-heap) ---
; Shrink mbedtls per-connection heap so HTTPS (OPDS/KOSync/OTA) stops tripping
; the OOM preflight gates on the X3/X4 (~46KB free after WiFi). DYNAMIC_BUFFER
; frees record/CA buffers between records; ASYMMETRIC keeps a usable IN size for
; servers that send large records while shrinking OUT; dropping KEEP_PEER_CERTIFICATE
; releases the peer cert after the handshake (unused downstream). Enabling
; custom_sdkconfig forces an ESP-IDF-from-source build (slow first build / CI).
custom_sdkconfig =
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  ; IN stays 8192: the X3 handshake heap wall needs the IN record buffer small
  ; (the prebuilt lib allocates it up-front at handshake — see
  ; docs/kosync-https-libbuilder.md). Do NOT raise it — that re-breaks the X3
  ; handshake. This knob is also inert vs the manually-swapped libmbedtls_2.a
  ; (8192 baked in). NOTE the IN cap is identical on X3 and X4 (same build/lib),
  ; so the X3-only large-download read failure is NOT a record-size cap (that
  ; would fail X4 too) — it points at X3 heap headroom during the body read.
  ; Diagnose via the read-error log in HttpDownloader.cpp (mbedtls code + largest8).
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=8192
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
  # CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE is not set
  # Free the CA bundle + private-key/DHM scratch after the handshake (sub-options
  # of DYNAMIC_BUFFER). The full Mozilla CA bundle parse is the bulk of the
  # handshake heap peak; releasing it once the session is up shrinks TLS's own
  # resident footprint during the body read — unlike borrowing heap from other
  # subsystems, this adds no fragmentation. Safe here because every TLS client
  # (HttpDownloader, KOReaderSyncClient) re-attaches the bundle per connection via
  # crt_bundle_attach, so the "must re-register cert for a re-handshake" caveat in
  # the IDF Kconfig help is already satisfied.
  CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
; Drop unused telemetry components. The source build pulls them in and esp_insights
; embeds https_server.crt, which trips a pioarduino _embed_files.py doubled-path bug.
; CrossPoint never uses insights/diagnostics, so removing them both fixes the build
; and shaves flash/RAM.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_rainmaker
  espressif/esp_schedule
  espressif/json_generator
  espressif/network_provisioning
  espressif/esp_rcp_update
  espressif/rmaker_common

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  ; --- wolfSSL TLS 1.3 (SecureNet) ---
  ; App-level HTTPS (KOSync, HttpDownloader/OPDS/fonts, OTA) runs on wolfSSL, not
  ; the system mbedTLS: mbedTLS handshakes to the Cloudflare 3-cert chain need
  ; ~55 KB free, which a reading session can't spare after WiFi — so bookmark
  ; sync's back-to-back GET+PUT fails. wolfSSL fits a handshake in ~35-43 KB and
  ; SecureHttpClient reuses one connection across a sync's legs. mbedTLS still
  ; ships in the base framework (WiFi/esp-tls); it is simply no longer used here.
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  ; MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
  ; (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
  ; that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
  ; temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
  ; leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
  ; SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
  -DHAVE_TLS_EXTENSIONS
  -DHAVE_SUPPORTED_CURVES
  -DHAVE_HKDF
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DWC_RSA_PSS
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_mbedtls.py
  pre:scripts/prune_build_cache.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

; wolfSSL (Arduino-wolfSSL) bundles an optional BLE example that pulls in the
; ESP32 BLE stack; this firmware never uses it and it bloats flash — drop it.
lib_ignore =
  BLE

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DTRACE_OOM_ALLOC=1 ; record failing-allocation size+caller into crash_report.txt (dev diagnostic)
  -DTRACE_HEAP=1 ; log per-activity heap (free/largest/minEver) to /opds_debug.txt (dev diagnostic)

; Single-diagnostic dev variants: same as default but with ONE tracer, so the
; other tracer's own overhead doesn't muddy what you're measuring.
;   oomtrace: OOM size/caller only — keeps max heap margin (no per-transition SD churn)
;   memtrace: per-activity heap drift only — no operator-new override
[env:oomtrace]
extends = base
build_flags =
  ${base.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DTRACE_OOM_ALLOC=1

[env:memtrace]
extends = base
build_flags =
  ${base.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DTRACE_HEAP=1


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device; PSRAM is
; intentionally left off (48KB framebuffer fits in DRAM, same as X4).
;   pio run -e sticky -t upload
[env:sticky]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  ; git_branch.py only injects CROSSPOINT_VERSION for the default env; set it here.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-sticky\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
