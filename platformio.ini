[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
; Authoritative for the release envs below. Dev builds take the HIGHER of this and
; the latest non-rc tag on upstream's develop (scripts/git_branch.py), so this only
; needs bumping by hand when cutting a release.
version = 1.6.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

; App-level HTTPS (KOSync, OPDS/fonts, OTA) runs on wolfSSL (SecureNet), not the
; system mbedTLS — see the wolfSSL build_flags below. The old mbedTLS record-buffer
; shrink (custom_sdkconfig CONFIG_MBEDTLS_* + the swapped scripts/mbedtls/
; libmbedtls_2.a.shrunk pinned by patch_mbedtls.py) is therefore retired: mbedTLS
; still ships in the base framework for WiFi/esp-tls, but nothing here handshakes
; over it, so its record-buffer size no longer matters. FirmwareFlasher is the only
; remaining esp_http_client user and it targets local http, not TLS.

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Keep FAT table sectors separate from file/directory data on ESP32.
# Requires scripts/patch_sdfat.py; reserves one additional inline sector cache.
  -DUSE_SEPARATE_FAT_CACHE=1
# SdFat transfers SPI a byte at a time on ESP32: SdFatConfig.h defaults
# USE_SPI_ARRAY_TRANSFER to 0 for every target but RP2040 and the UNO R4, and each
# Arduino transfer(uint8_t) writes the data register, starts the transfer and spins.
# 1 routes through transfer(buf, count) -> transferBytes() -> spiTransferBytesNL(),
# which batches into the SPI FIFO: ~3x on SD reads, at the cost of a 512-byte stack
# buffer on the send path. Inert on SDMMC boards, which bypass SdFat's SPI driver.
  -DUSE_SPI_ARRAY_TRANSFER=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  ; NOTE: no -DFREEINK_DEVICE_* here. Each env selects its own board(s), because
  ; BoardConfig rejects a build mixing MCU families and every env extends base.
  ; --- wolfSSL TLS 1.3 (SecureNet) ---
  ; App-level HTTPS (KOSync, HttpDownloader/OPDS/fonts, OTA) runs on wolfSSL, not
  ; the system mbedTLS: mbedTLS handshakes to the Cloudflare 3-cert chain need
  ; ~55 KB free, which a reading session can't spare after WiFi — so bookmark
  ; sync's back-to-back GET+PUT fails. wolfSSL fits a handshake in ~35-43 KB and
  ; SecureHttpClient reuses one connection across a sync's legs. mbedTLS still
  ; ships in the base framework (WiFi/esp-tls); it is simply no longer used here.
# FreeInkFont optional FreeType modules. The auto-hinter (~50KB text, and it only links on
# the PSRAM boards that compile the vector-font path in) is REQUIRED by the BW-aware 2-bit
# quantizer in TtfEpdFont: with the ink threshold at 50% coverage, unhinted thin strokes that
# straddle pixel columns drop below threshold and break up; Light hinting snaps stems to
# full-coverage pixels so they survive. Still OFF: the B/W raster (_MONOCHROME, ~5KB) is dead
# while every TtfEpdFont::load() is 2-bit; psnames (_PSNAMES, ~64KB) only serves glyph-NAME
# lookups a codepoint-driven renderer never makes; gzip (_GZIP, ~13KB) only decompresses
# .gz/WOFF, and the registry accepts .ttf/.otf/.ttc.
  -DFREEINK_FONT_ENABLE_AUTOHINT=1
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  ; MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
  ; (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
  ; that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
  ; temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
  ; leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
  ; SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  ; Same argument, for RSA. ECC alone covers an all-ECDSA chain (github.com), but
  ; release-assets.githubusercontent.com serves RSA-2048, and RSA verify then falls off
  ; SP onto fast-math mp_exptmod, whose FP_MAX_BITS temporaries are heap-allocated under
  ; WOLFSSL_SMALL_STACK. That is the MP_EXPTMOD_E (-112) / MEMORY_E (-125) seen on every
  ; font download once the largest contiguous block drops under ~25 KB, while a handshake
  ; to github.com at the identical heap succeeds. sp_RsaPublic_2048 is already compiled
  ; into sp_c32.c; this flag is what routes the 2048-bit modexp to it.
  -DWOLFSSL_HAVE_SP_RSA
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
# Negotiate 2KB TLS records (RFC 6066 max_fragment_length). wolfSSL sizes its
# receive buffer per incoming record; default 16KB records need a ~17KB contiguous
# alloc that fails (MEMORY_E) at the ~17-20KB fragmented largest-block KOSync's
# stats handshake runs at on the X3. Two ~2KB records fit easily. Activated by the
# wolfSSL_UseMaxFragment(ssl, WOLFSSL_MFL_2_11) call in SecureClient.cpp.
  -DHAVE_MAX_FRAGMENT
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; UI languages compiled into the firmware, as comma-separated codes from lib/I18n/translations
; (e.g. "en,de,fr"). English is always included. Languages left out are not offered in the
; language picker; a device whose saved language is not built in falls back to English.
custom_i18n_builtin_langs = all

; Hyphenation pattern sets compiled in, as comma-separated primary tags from
; lib/Epub/Epub/hyphenation/generated (e.g. "en,de,fr"), or "all". English is always
; included. A language left out only loses its line breaking -- its books still render.
; This is the largest data block after the fonts: 351 KB in total, of which German is 206 KB.
custom_hyphenation_langs = all

extra_scripts =
  pre:scripts/patch_pioarduino_cache.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/select_hyphenation.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/prune_build_cache.py
  post:scripts/patch_sdfat.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  ; USB mass storage (X4 Pro only, behind FREEINK_CAP_USB_MSC). Linking it costs
  ; nothing on boards that never call into it.
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  ; Standalone FreeType/stb TTF engine backing lib/EpdFont/TtfEpdFont (runtime .ttf/.otf
  ; rendering on PSRAM boards). Vendors only stb_truetype + FreeType (no expat), so it does
  ; not hit the FreeInkBook duplicate-XML_* symbol problem. Compiled out on boards without
  ; BOARD_HAS_PSRAM: VectorFontSupport.h gates every reference, so nothing links it there.
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  bblanchon/ArduinoJson @ 7.4.2
  ; Pinned for the reviewed cache patches in scripts/sdfat_patches/.
  greiman/SdFat @ 2.3.1
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

; wolfSSL (Arduino-wolfSSL) bundles an optional BLE example that pulls in the
; ESP32 BLE stack; this firmware never uses it and it bloats flash — drop it.
lib_ignore =
  BLE

;   Custom-core profile. Setting custom_component_remove makes pioarduino rebuild the
; Arduino core from source, which lets us drop unused telemetry components: esp_insights
; embeds https_server.crt and trips a pioarduino _embed_files.py doubled-path bug, and
; CrossPoint uses none of them.
;
; USB-OTG profiles deliberately do NOT extend this. The source rebuild omits pioarduino's
; prebuilt TinyUSB component graph, which FREEINK_CAP_USB_MSC needs; they take the stock
; prebuilt core instead, where the embed bug cannot arise because that script never runs.
[firmware_tuned]
custom_component_remove =
  espressif/esp_insights
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_rainmaker
  espressif/esp_schedule
  espressif/json_generator
  espressif/network_provisioning
  espressif/esp_rcp_update
  espressif/rmaker_common

[env:default]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (upstream release tag or
  ; [crosspoint] version, whichever is higher, plus the short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DTRACE_OOM_ALLOC=1 ; record failing-allocation size+caller into crash_report.txt (dev diagnostic)
  -DTRACE_HEAP=1 ; log per-activity heap (free/largest/minEver) to /opds_debug.txt (dev diagnostic)

; Single-diagnostic dev variants: same as default but with ONE tracer, so the
; other tracer's own overhead doesn't muddy what you're measuring.
;   oomtrace: OOM size/caller only — keeps max heap margin (no per-transition SD churn)
;   memtrace: per-activity heap drift only — no operator-new override
[env:oomtrace]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  -DTRACE_OOM_ALLOC=1

[env:memtrace]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  -DTRACE_HEAP=1


[env:gh_release]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device. The
; N16R8 board definition enables octal PSRAM.
;   pio run -e sticky -t upload
[env:sticky]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  ; CROSSPOINT_VERSION comes from scripts/git_branch.py, like the other dev envs
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

; --- Xteink X4 Pro — ESP32-S3, 16MB flash / 8MB PSRAM, SSD1677 + GT911 --------
; The SDK profile supplies the pinout, display, touch controller and capacitive
; Home key. Same 800x480 panel as the C3 X4, different MCU family.
;   pio run -e x4pro -t upload
[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; Prebuilt dio_opi Arduino variant: its TinyUSB component is compiled in for CDC and
; MSC. This profile extends base alone, not firmware_tuned, whose source rebuild of the
; core omits that component.
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  ; CROSSPOINT_VERSION comes from scripts/git_branch.py, like the other dev envs
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; X4 Pro SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; Frontlight PWM clocked from RC_FAST with KEEP_ALIVE so it survives light
  ; sleep (freeink-sdk FREEINK_FRONTLIGHT_LS); pairs with the HalPowerManager
  ; change that stops a lit frontlight from blocking sleep.
  -DFREEINK_FRONTLIGHT_LS

; X4 Pro production builds. Same profile as [env:x4pro] minus the dev serial wait and
; with a pinned CROSSPOINT_VERSION -- this is what release.yml publishes, and what OTA
; on an X4 Pro downloads.
[env:x4pro-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_FRONTLIGHT_LS

[env:x4pro-gh_release_rc]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_FRONTLIGHT_LS
