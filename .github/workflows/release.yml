name: Compile Release
on:
  push:
    tags:
      - '*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e gh_release

      # X4 Pro is a different MCU family (ESP32-S3), so it cannot share the C3
      # binary and needs its own asset — without one, OTA on an X4 Pro has
      # nothing to download.
      - name: Build CrossPoint (X4 Pro)
        run: pio run -e x4pro-gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      - name: Upload Artifacts (X4 Pro)
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-x4pro-${{ github.ref_name }}
          path: |
            .pio/build/x4pro-gh_release/bootloader.bin
            .pio/build/x4pro-gh_release/firmware.bin
            .pio/build/x4pro-gh_release/firmware.elf
            .pio/build/x4pro-gh_release/firmware.map
            .pio/build/x4pro-gh_release/partitions.bin
